name: producao — diagnóstico (só leitura)

# Macuxi ERP (T-0120, v0.3.27): diagnóstico do banco de produção SÓ DE LEITURA, disparado à mão (workflow_dispatch, sem
# entradas). Roda o scripts/deploy/producao/diagnostico.sh do commit disparado (normalmente o main) na VM de produção:
# psql do compose.yml em uso em /opt/macuxierp, como o admin do DBaaS (dono das tabelas), dentro de BEGIN READ ONLY ...
# ROLLBACK, com default_transaction_read_only e statement_timeout pelo PGOPTIONS. Saída: só contagens, estados, códigos e
# tenant_id (UUID), no log e no resumo do job. Nada de nome, e-mail, CNPJ nem corpo (scripts/deploy/diagnostico.test.mjs).
# Não troca nada na VM: não usa nem apaga o ~/macuxierp-deploy do publicar; manda diagnostico.sh, diagnostico.sql e
# comum.sh para uma pasta temporária, roda e apaga.
# Uma coisa por vez na VM (ADR 0003): o diagnostico.sh pega a TRAVA DA VM (/var/lock/macuxi-producao-vm.lock, a mesma do
# implantar.sh e do FDV) antes do docker compose, e espera a publicação em andamento acabar (até 10 min). O grupo de
# concorrência é PRÓPRIO (producao-diagnostico), de propósito: no grupo producao-vm do publicar, um diagnóstico na fila
# cancelaria a publicação que estivesse esperando (o Actions guarda um só pendente por grupo).
# SSH igual ao do producao-publicar.yml: PROD_SSH_KEY, PROD_HOST e PROD_USER; chave do host, sempre com
# StrictHostKeyChecking yes, nesta ordem: secret PROD_SSH_KNOWN_HOSTS → .github/producao/known_hosts → cache do runner
# (macuxierp-prod-known-hosts-v1) → TOFU (ssh-keyscan ed25519, com aviso e a impressão digital no resumo; grava no cache
# desta ref depois do primeiro SSH que deu certo).
# Environment DIAGNOSTICO (decisão do PO): próprio, SEM revisor (só lê) e restrito ao branch main; os secrets PROD_SSH_*
# (PROD_SSH_KEY e PROD_SSH_KNOWN_HOSTS), PROD_HOST e PROD_USER são cópias dos de produção guardadas nesse environment. Quem
# cria o environment e as cópias é o Alexandre; sem ele, o job falha só no passo "secrets presentes".
# Nenhum segredo vai para log: secrets só em variável de ambiente, nunca na linha de comando; nenhum set -x.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao-diagnostico
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  diagnostico:
    name: diagnóstico do banco de produção (só leitura)
    environment: DIAGNOSTICO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/deploy/producao
            .github/producao

      - name: scripts do diagnóstico presentes
        run: |
          for f in diagnostico.sh diagnostico.sql comum.sh; do
            test -s "scripts/deploy/producao/$f" || { echo "::error::scripts/deploy/producao/$f ausente neste commit (T-0120)"; exit 1; }
          done

      - name: secrets presentes (só os nomes)
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          falta=()
          for n in PROD_SSH_KEY PROD_HOST PROD_USER; do
            [ -n "${!n}" ] || falta+=("$n")
          done
          [ ${#falta[@]} -eq 0 ] || { echo "::error::faltam secrets no environment DIAGNOSTICO (cópias dos de produção): ${falta[*]}"; exit 1; }
          for n in PROD_HOST PROD_USER; do
            v="$(printf '%s' "${!n}" | tr -d '\r')"
            case "$v" in *$'\n'*) echo "::error::$n tem quebra de linha"; exit 1;; esac
          done
          [[ "$PROD_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "::error::PROD_USER inválido"; exit 1; }
          echo "secrets obrigatórios presentes"

      - name: chave do host no cache do runner
        id: conhecidos
        uses: actions/cache/restore@v4
        with:
          path: .producao-ssh/known_hosts
          key: macuxierp-prod-known-hosts-v1

      - name: chave SSH
        id: ssh
        env:
          CHAVE: ${{ secrets.PROD_SSH_KEY }}
          HOST: ${{ secrets.PROD_HOST }}
          CONHECIDOS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          DO_CACHE: ${{ steps.conhecidos.outputs.cache-hit }}
        run: |
          install -d -m 700 ~/.ssh
          # mesma remontagem do producao-publicar.yml (chave colada numa linha só)
          bruto="$(printf '%s' "$CHAVE" | tr -d '\r')"
          cab="$(printf '%s' "$bruto" | grep -o -- '-----BEGIN [A-Z0-9 ]*-----' | head -n1 || true)"
          if [ -n "$cab" ]; then
            tipo="${cab#-----BEGIN }"; tipo="${tipo%-----}"
            rod="-----END $tipo-----"
            corpo="${bruto#*"$cab"}"; corpo="${corpo%%"$rod"*}"
            corpo="$(printf '%s' "$corpo" | tr -d ' \t\n')"
            { printf '%s\n' "$cab"; printf '%s' "$corpo" | fold -w 70; printf '\n%s\n' "$rod"; } > ~/.ssh/prod
          else
            printf '%s\n' "$bruto" > ~/.ssh/prod
          fi
          chmod 600 ~/.ssh/prod
          ssh-keygen -y -P '' -f ~/.ssh/prod > /dev/null 2>&1 || { echo "::error::PROD_SSH_KEY ilegível (veja as mensagens do producao-publicar.yml)"; exit 1; }
          CACHE=.producao-ssh/known_hosts
          fonte=""
          if [ -n "$CONHECIDOS" ]; then
            printf '%s\n' "$CONHECIDOS" | tr -d '\r' > ~/.ssh/known_hosts
            echo "chave do host: secret PROD_SSH_KNOWN_HOSTS"
          elif [ -s .github/producao/known_hosts ]; then
            tr -d '\r' < .github/producao/known_hosts > ~/.ssh/known_hosts
            echo "chave do host: .github/producao/known_hosts (versionado)"
          elif [ "$DO_CACHE" = true ] && [ -s "$CACHE" ]; then
            cp "$CACHE" ~/.ssh/known_hosts
            echo "chave do host: cache do runner (macuxierp-prod-known-hosts-v1)"
            fonte="cache do runner"
          else
            # TOFU (decisão de 22/11, a mesma do publicar): o cache do publicar nasce na ref da tag e não é visto daqui
            install -d -m 700 .producao-ssh
            ssh-keyscan -T 15 -t ed25519 "$HOST" 2>/dev/null | tr -d '\r' | grep -v '^#' > "$CACHE" || true
            grep -q ' ssh-ed25519 ' "$CACHE" || { echo "::error::ssh-keyscan não trouxe a chave ed25519 do PROD_HOST"; exit 1; }
            cp "$CACHE" ~/.ssh/known_hosts
            digital="$(ssh-keygen -lf "$CACHE" | awk '{print $1, $2, $NF}')"
            echo "::warning::chave do host por TOFU (ssh-keyscan): $digital — confira com a da VM (ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub)"
            {
              echo "### Chave do host de produção por TOFU"
              echo
              echo "Impressão digital: \`$digital\`. Confira com \`ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\` na VM."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "tofu=1" >> "$GITHUB_OUTPUT"
            fonte="TOFU"
          fi
          # Resumo da chave do host SEM o host (prepara o PR B, v0.3.30: .github/producao/known_hosts com
          # "macuxierp-prod ssh-ed25519 ..." + HostKeyAlias). Só tipo e chave pública; o campo 1 (host) nunca sai.
          if [ -n "$fonte" ]; then
            esperada='SHA256:wRktlR17SPnfY7hK7u1/4XhMJ1qeON3xyFzF+b9Gy0s'
            chave_host="$(awk '$2=="ssh-ed25519"{print $2" "$3; exit}' ~/.ssh/known_hosts)"
            tmp_kh="$(mktemp)"; printf 'macuxierp-prod %s\n' "$chave_host" > "$tmp_kh"
            digital_host="$(ssh-keygen -lf "$tmp_kh" 2>/dev/null | awk '{print $2}' || true)"; rm -f "$tmp_kh"
            if [ -n "$digital_host" ] && [ "$digital_host" = "$esperada" ]; then
              confere="bate com a conferida na VM (ED25519 $esperada)"
            else
              confere="NÃO bate com a conferida na VM (ED25519 $esperada)"
              echo "::warning::chave do host ($fonte) não bate com a conferida na VM: ${digital_host:-sem ed25519}"
            fi
            {
              echo "### Chave do host de produção ($fonte)"
              echo
              echo "Chave pública: \`$chave_host\`"
              echo "Impressão digital: \`$digital_host\` — $confere."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'Host prod\n  HostName %s\n  IdentityFile ~/.ssh/prod\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' "$HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: diagnóstico na VM (só leitura)
        id: diag
        env:
          USUARIO: ${{ secrets.PROD_USER }}
        run: |
          set -o pipefail
          pasta="$(ssh -l "$USUARIO" prod 'mktemp -d "$HOME/macuxierp-diagnostico.XXXXXX"')"
          [[ "$pasta" =~ ^/[A-Za-z0-9._/-]+/macuxierp-diagnostico\.[A-Za-z0-9]{6}$ ]] || { echo "::error::pasta temporária inválida na VM"; exit 1; }
          echo "ssh_ok=1" >> "$GITHUB_OUTPUT"
          set +e
          scp -q -o User="$USUARIO" scripts/deploy/producao/diagnostico.sh scripts/deploy/producao/diagnostico.sql \
            scripts/deploy/producao/comum.sh "prod:$pasta/" \
            && ssh -l "$USUARIO" prod "bash '$pasta/diagnostico.sh'" 2>&1 | tee "$RUNNER_TEMP/diagnostico.txt"
          saida=$?
          ssh -l "$USUARIO" prod "rm -rf '$pasta'" || true
          set -e
          {
            echo "### Diagnóstico de produção (só leitura) — commit \`${GITHUB_SHA::12}\`"
            echo
            echo '```'
            cat "$RUNNER_TEMP/diagnostico.txt" 2>/dev/null || true
            echo '```'
            [ "$saida" = 0 ] || { echo; echo "**Falhou (código $saida).**"; }
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$saida" = 0 ] || { echo "::error::diagnóstico falhou (código $saida; log acima)"; exit "$saida"; }

      # TOFU: grava a chave no cache (escopo desta ref) só depois do primeiro SSH que deu certo
      - name: chave do host no cache do runner (TOFU)
        if: ${{ always() && steps.ssh.outputs.tofu == '1' && steps.diag.outputs.ssh_ok == '1' }}
        uses: actions/cache/save@v4
        with:
          path: .producao-ssh/known_hosts
          key: macuxierp-prod-known-hosts-v1

      - name: limpar a chave do runner
        if: ${{ always() }}
        run: rm -rf ~/.ssh/prod ~/.ssh/config ~/.ssh/known_hosts .producao-ssh
