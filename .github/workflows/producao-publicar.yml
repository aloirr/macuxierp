name: producao — publicar

# Macuxi ERP (ADR 0003): mesmo desenho do "producao — publicar" do Macuxi FDV, na MESMA VM de produção, num serviço
# próprio (/opt/macuxierp, projeto compose macuxierp) e com imagens próprias no GHCR (macuxierp-api, macuxierp-web-prod).
#   1. conferir (sem segredo): a tag v* aponta para um commit do main com a suíte completa verde, o CI verde e a imagem
#      ghcr.io/<dono>/macuxierp-api:<sha> existe (montada pelo "producao — liberar versão"). Fixa o DIGEST;
#   2. bko (sem segredo): monta o BKO de produção do mesmo commit
#      → ghcr.io/<dono>/macuxierp-web-prod:<sha>, por digest;
#   3. deploy (environment PRODUCAO, só PROD_SSH_KEY, PROD_HOST e PROD_USER): SSH da VM, copia scripts/deploy/producao e o
#      compose.yml, preparar-vm.sh (gera o .env do ERP e copia banco.env, admin.env, segredos.env e a CA do FDV NA VM,
#      pelo ambiente-vm.sh; nenhum segredo do banco sai do GitHub), login no GHCR na VM, implantar.sh (que pega a TRAVA
#      DA VM compartilhada com o FDV antes de qualquer compose; ADR 0003), confere e volta atrás se falhar; confere pelo domínio.
# Chave do host (known_hosts), sempre com StrictHostKeyChecking yes, nesta ordem: secret PROD_SSH_KNOWN_HOSTS (se existir) →
# arquivo versionado .github/producao/known_hosts → cache do runner (actions/cache, chave fixa) → TOFU (ssh-keyscan
# ed25519, com aviso e a impressão digital SHA256 no resumo do job, e grava no cache depois do primeiro SSH que deu certo).
# Enquanto a T-0024 (scripts/deploy/producao e Dockerfiles do ERP) não entrar, o passo "implantação do ERP pronta"
# fica vermelho de propósito: nenhuma versão é publicada pela metade.
# Gatilho: SÓ tag v*: push da tag ou disparo manual NA tag (workflow_dispatch com --ref v*; branch é recusada no conferir
# e pelo environment PRODUCAO, que só aceita ref de tag). TRAVA (ADR 0046): o PRODUCAO não para (sem "Required
# reviewers" no plano), então a tag só publica com a issue "Aprovar deploy <tag>" aprovada (scripts/ci/producao-trava.mjs
# publicar: fechada como concluída, rótulo aprovado, SHA do marcador = commit da tag, comentário "aprovado <tag>" do
# aloirr). O caminho normal: "producao — liberar versão" (confere e abre a issue) → comentário "aprovado vX.Y.Z" na issue
# → "producao — aprovar versão" (confere de novo, cria a tag com o GITHUB_TOKEN, fecha a issue e dispara este na tag).
# Tag criada à mão sem issue aprovada fica vermelha no conferir. A conferência de commit, CI e imagem é a mesma nos três;
# a da suíte, no aprovar e aqui (scripts/ci/producao-conferir.mjs). Voltar a uma versão anterior = "Re-run all jobs" no
# run da tag anterior (a issue dela continua aprovada; as tags até v1.0.7, anteriores à trava, rodam o publicar do
# próprio commit, sem a trava).
# Nenhum segredo vai para log: secrets só em variável de ambiente e no stdin do ssh, nunca na linha de comando; nenhum set -x.

on:
  push:
    tags: ['v*']
  # só na tag (o conferir recusa branch); disparado pelo producao-aprovar.yml
  workflow_dispatch:

permissions: {}

# uma publicação por vez na VM de produção; a nova espera a anterior (nunca dois compose up ao mesmo tempo)
concurrency:
  group: producao-vm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  conferir:
    name: tag aprovada na issue, suíte completa, no main, CI verde e imagem da API do commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
      issues: read
    outputs:
      sha: ${{ steps.alvo.outputs.sha }}
      versao: ${{ steps.alvo.outputs.versao }}
      dono: ${{ steps.alvo.outputs.dono }}
      api: ${{ steps.alvo.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: SHA do commit da tag
        run: echo "SHA=$(git rev-parse "$GITHUB_SHA^{commit}")" >> "$GITHUB_ENV"

      - name: tag v* (push ou disparo na tag)
        run: node scripts/ci/producao-conferir.mjs ref

      # trava do deploy (ADR 0046): sem a issue "Aprovar deploy <tag>" aprovada, nada segue (nem o BKO nem o PRODUCAO)
      - name: issue "Aprovar deploy" da tag aprovada
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ github.ref_name }}
        run: node scripts/ci/producao-trava.mjs publicar

      - name: suíte completa verde no SHA da tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/producao-conferir.mjs suite

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesma conferência do producao-liberar.yml (scripts/ci/producao-conferir.mjs): commit no main, CI verde de push no
      # main e digest da imagem da API do commit (fixa o DIGEST: a produção roda a imagem do commit que passou no CI).
      - name: commit no main, CI verde e digest da imagem da API
        id: alvo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ github.ref_name }}
          DONO: ${{ github.repository_owner }}
        run: node scripts/ci/producao-conferir.mjs conferir

  bko:
    name: BKO de produção do mesmo commit
    needs: conferir
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      bko: ${{ steps.ref.outputs.bko }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.conferir.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # T-0154: build carregado no Docker do runner; o envio ao GHCR é o passo seguinte, com novas tentativas no 403/429/5xx
      - name: imagem macuxierp-web-prod (build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ needs.conferir.outputs.dono }}/macuxierp-web-prod:${{ needs.conferir.outputs.sha }}
            ghcr.io/${{ needs.conferir.outputs.dono }}/macuxierp-web-prod:${{ needs.conferir.outputs.versao }}
          # demo desligada (ADR 0051): sem o cache do BKO da demo; só o cache próprio da produção
          cache-from: type=gha,scope=macuxierp-web-prod
          cache-to: type=gha,scope=macuxierp-web-prod,mode=max

      - name: imagem macuxierp-web-prod (envio ao GHCR, com novas tentativas)
        env:
          IMG: ghcr.io/${{ needs.conferir.outputs.dono }}/macuxierp-web-prod
          SHA: ${{ needs.conferir.outputs.sha }}
          VERSAO: ${{ needs.conferir.outputs.versao }}
        run: |
          bash scripts/deploy/producao/ghcr-tentar.sh "envio do BKO de produção ($SHA)" -- docker push "$IMG:$SHA"
          bash scripts/deploy/producao/ghcr-tentar.sh "envio do BKO de produção ($VERSAO)" -- docker push "$IMG:$VERSAO"

      - name: referência por digest
        id: ref
        env:
          IMG: ghcr.io/${{ needs.conferir.outputs.dono }}/macuxierp-web-prod:${{ needs.conferir.outputs.sha }}
          DONO: ${{ needs.conferir.outputs.dono }}
        run: |
          # digest do manifesto enviado (o docker push grava o RepoDigest local; sem nova consulta ao GHCR)
          DIGEST="$(docker image inspect "$IMG" --format '{{range .RepoDigests}}{{println .}}{{end}}' | sed -n "s|^ghcr.io/$DONO/macuxierp-web-prod@||p" | head -n1)"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::digest do BKO inválido"; exit 1; }
          echo "bko=ghcr.io/$DONO/macuxierp-web-prod@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "BKO: ghcr.io/$DONO/macuxierp-web-prod@$DIGEST"

  deploy:
    name: deploy na VM de produção (aprovação no environment PRODUCAO)
    needs: [conferir, bko]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: PRODUCAO
      url: https://erp.macuxifdv.com.br
    permissions:
      contents: read
      packages: read
    env:
      VERSAO: ${{ needs.conferir.outputs.versao }}
      API: ${{ needs.conferir.outputs.api }}
      BKO: ${{ needs.bko.outputs.bko }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.conferir.outputs.sha }}
          persist-credentials: false
          # modo cone: os arquivos da raiz (compose.yml) vêm sempre junto com a pasta listada
          sparse-checkout: |
            scripts/deploy/producao
            .github/producao

      - name: implantação do ERP pronta
        run: |
          for f in scripts/deploy/producao/implantar.sh compose.yml; do
            test -f "$f" || { echo "::error::$f ainda não existe (T-0024, ADR 0003): nada foi publicado"; exit 1; }
          done

      # T-0024: o .env do ERP e as cópias de banco.env, admin.env, segredos.env e da CA do FDV nascem NA VM (preparar-vm.sh →
      # ambiente-vm.sh); o GitHub só guarda o acesso SSH
      - name: secrets do environment presentes (só os nomes)
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          falta=()
          for n in PROD_SSH_KEY PROD_HOST PROD_USER; do
            [ -n "${!n}" ] || falta+=("$n")
          done
          [ ${#falta[@]} -eq 0 ] || { echo "::error::faltam secrets no environment PRODUCAO: ${falta[*]}"; exit 1; }
          # valores de uma linha só; a chave SSH é a exceção
          for n in PROD_HOST PROD_USER; do
            v="$(printf '%s' "${!n}" | tr -d '\r')"
            case "$v" in *$'\n'*) echo "::error::$n tem quebra de linha"; exit 1;; esac
          done
          [[ "$PROD_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "::error::PROD_USER inválido"; exit 1; }
          echo "secrets obrigatórios presentes"

      # known_hosts do runner guardado no cache do Actions (chave fixa; o cache usa o token do runtime, não o GITHUB_TOKEN,
      # e funciona com as permissões mínimas do job). Fica no workspace, fora do ~/.ssh.
      - name: chave do host no cache do runner
        id: conhecidos
        uses: actions/cache/restore@v4
        with:
          path: .producao-ssh/known_hosts
          key: macuxierp-prod-known-hosts-v1

      - name: chave SSH
        id: ssh
        env:
          CHAVE: ${{ secrets.PROD_SSH_KEY }}
          HOST: ${{ secrets.PROD_HOST }}
          CONHECIDOS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          DO_CACHE: ${{ steps.conhecidos.outputs.cache-hit }}
        run: |
          install -d -m 700 ~/.ssh
          # a chave colada pelo celular pode chegar numa linha só (quebras viram espaço ou somem): remonta o bloco
          # entre o BEGIN e o END, em linhas de 70, antes de gravar; chave com quebras certas sai igual
          bruto="$(printf '%s' "$CHAVE" | tr -d '\r')"
          cab="$(printf '%s' "$bruto" | grep -o -- '-----BEGIN [A-Z0-9 ]*-----' | head -n1 || true)"
          if [ -n "$cab" ]; then
            tipo="${cab#-----BEGIN }"; tipo="${tipo%-----}"
            rod="-----END $tipo-----"
            corpo="${bruto#*"$cab"}"; corpo="${corpo%%"$rod"*}"
            corpo="$(printf '%s' "$corpo" | tr -d ' \t\n')"
            { printf '%s\n' "$cab"; printf '%s' "$corpo" | fold -w 70; printf '\n%s\n' "$rod"; } > ~/.ssh/prod
          else
            printf '%s\n' "$bruto" > ~/.ssh/prod
          fi
          chmod 600 ~/.ssh/prod
          # confere a chave antes do SSH e diz o motivo sem mostrar o conteúdo
          if ! erro="$(ssh-keygen -y -P '' -f ~/.ssh/prod 2>&1 >/dev/null)"; then
            case "$erro" in
              *passphrase*) motivo="a chave tem senha (passphrase); o deploy precisa de uma chave sem senha";;
              *) case "$bruto" in
                   *PuTTY-User-Key-File*) motivo="a chave está no formato PuTTY; exporte no formato OpenSSH";;
                   ssh-ed25519\ *|ssh-rsa\ *|ecdsa-sha2-*) motivo="foi colada a chave PÚBLICA; o PROD_SSH_KEY é a chave PRIVADA";;
                   *) motivo="o conteúdo não é uma chave privada OpenSSH completa (cópia cortada?)";;
                 esac;;
            esac
            echo "::error::PROD_SSH_KEY: $motivo"
            exit 1
          fi
          echo "chave privada lida; impressão digital da pública: $(ssh-keygen -lf ~/.ssh/prod | awk '{print $2}')"
          CACHE=.producao-ssh/known_hosts
          if [ -n "$CONHECIDOS" ]; then
            printf '%s\n' "$CONHECIDOS" | tr -d '\r' > ~/.ssh/known_hosts
            echo "chave do host: secret PROD_SSH_KNOWN_HOSTS"
          elif [ -s .github/producao/known_hosts ]; then
            tr -d '\r' < .github/producao/known_hosts > ~/.ssh/known_hosts
            echo "chave do host: .github/producao/known_hosts (versionado)"
          elif [ "$DO_CACHE" = true ] && [ -s "$CACHE" ]; then
            cp "$CACHE" ~/.ssh/known_hosts
            echo "chave do host: cache do runner (macuxierp-prod-known-hosts-v1)"
          else
            # TOFU (decisão de 22/11: sem PROD_SSH_KNOWN_HOSTS): confia na primeira resposta e grava no cache
            install -d -m 700 .producao-ssh
            ssh-keyscan -T 15 -t ed25519 "$HOST" 2>/dev/null | tr -d '\r' | grep -v '^#' > "$CACHE" || true
            grep -q ' ssh-ed25519 ' "$CACHE" || { echo "::error::ssh-keyscan não trouxe a chave ed25519 do PROD_HOST"; exit 1; }
            cp "$CACHE" ~/.ssh/known_hosts
            # só tamanho, impressão digital e tipo (sem o nome do host)
            digital="$(ssh-keygen -lf "$CACHE" | awk '{print $1, $2, $NF}')"
            echo "::warning::chave do host por TOFU (ssh-keyscan, primeira conexão): $digital — confira com a da VM (ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub)"
            {
              echo "### Chave do host de produção por TOFU"
              echo
              echo "Sem PROD_SSH_KNOWN_HOSTS, sem .github/producao/known_hosts e sem cache: a chave veio do ssh-keyscan."
              echo "Impressão digital: \`$digital\`. Confira com \`ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\` na VM."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "tofu=1" >> "$GITHUB_OUTPUT"
          fi
          printf 'Host prod\n  HostName %s\n  IdentityFile ~/.ssh/prod\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' "$HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: copiar scripts e preparar a VM (idempotente; gera o ambiente do ERP na VM)
        env:
          USUARIO: ${{ secrets.PROD_USER }}
        run: |
          ssh -l "$USUARIO" prod 'rm -rf ~/macuxierp-deploy && mkdir -p ~/macuxierp-deploy'
          scp -q -o User="$USUARIO" scripts/deploy/producao/* compose.yml prod:macuxierp-deploy/
          ssh -l "$USUARIO" prod 'sudo bash ~/macuxierp-deploy/preparar-vm.sh "$USER"'

      # TOFU: grava a chave no cache só depois do primeiro SSH que deu certo (a VM aceitou a chave do deploy)
      - name: chave do host no cache do runner (TOFU)
        if: ${{ steps.ssh.outputs.tofu == '1' }}
        uses: actions/cache/save@v4
        with:
          path: .producao-ssh/known_hosts
          key: macuxierp-prod-known-hosts-v1

      - name: publicar (login no GHCR na VM, banco, compose up, conferência, volta atrás se falhar)
        env:
          USUARIO: ${{ secrets.PROD_USER }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | ssh -l "$USUARIO" prod "docker login ghcr.io -u '$ATOR' --password-stdin >/dev/null"
          set +e
          ssh -l "$USUARIO" prod "bash ~/macuxierp-deploy/implantar.sh --api '$API' --bko '$BKO' --versao '$VERSAO'"
          saida=$?
          ssh -l "$USUARIO" prod 'docker logout ghcr.io >/dev/null 2>&1 || true'
          case "$saida" in
            0) echo "publicado: $VERSAO" ;;
            3) echo "::error::$VERSAO falhou na conferência e a produção VOLTOU para a versão anterior (log acima)" ;;
            *) echo "::error::publicação de $VERSAO falhou antes de trocar a aplicação (código $saida; log acima)" ;;
          esac
          exit $saida

      - name: conferir pelo domínio
        run: |
          ok=0
          for i in $(seq 1 20); do
            corpo="$(curl -fsS -m 10 https://erp.macuxifdv.com.br/v1/saude 2>/dev/null || true)"
            if printf '%s' "$corpo" | grep -q "\"versao\":\"$VERSAO\""; then ok=1; echo "erp.macuxifdv.com.br/v1: $VERSAO no ar"; break; fi
            sleep 6
          done
          [ "$ok" = 1 ] || { echo "::error::erp.macuxifdv.com.br/v1/saude não devolveu $VERSAO (rota erp. no túnel da Cloudflare do FDV: /v1 → http://macuxierp-api:8100)"; exit 1; }
          curl -fsS -m 10 -o /dev/null https://erp.macuxifdv.com.br/login && echo "erp.macuxifdv.com.br: ok" \
            || { echo "::error::erp.macuxifdv.com.br/login não respondeu (rota erp. no túnel do FDV: o resto → http://macuxierp-web:3100)"; exit 1; }

      - name: limpar a chave do runner
        if: ${{ always() }}
        run: rm -rf ~/.ssh/prod ~/.ssh/config ~/.ssh/known_hosts .producao-ssh
